{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Dagooc Farm</title>
    <link rel="stylesheet" href="{% static 'farm_management/styles.css' %}">
    <script defer src="{% static 'farm_management/view-mode.js' %}"></script>
</head>
<body class="login-body">
    <div class="page-watermark" aria-hidden="true"></div>
    <div class="login-shell credential-shell">
        <section class="login-panel">
            <div class="brand-box login-brand">
                <div class="brand-logo-wrap">
                    <img src="{% static 'farm_management/logo.svg' %}" alt="Dagooc Farm Logo" class="brand-logo">
                </div>
                <div>
                    <h2>Dagooc Farm</h2>
                    <p>Owner & Staff Portal</p>
                </div>
            </div>

            <h1>Sign in</h1>
            <p class="subtext">Enter your account credentials to continue.</p>

            <form class="credential-form" id="credential-demo-form">
                <div class="credential-field">
                    <label for="username">Username or email</label>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="name@example.com" required>
                </div>
                <div class="credential-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
                </div>
                <label class="credential-options">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>
                <button type="submit" class="primary-btn credential-submit">Sign in</button>
            </form>
        </section>
    </div>

    <script>
        document.getElementById('credential-demo-form').addEventListener('submit', function (event) {
            event.preventDefault();
            window.location.assign("{% url 'login' %}");
        });
    </script>
</body>
</html>
