{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagooc Farm Login</title>
    <link rel="stylesheet" href="{% static 'farm_management/styles.css' %}">
</head>
<body class="login-body">
    <div class="page-watermark" aria-hidden="true"></div>
    <div class="login-shell">
        <div class="login-panel">
            <div class="brand-box login-brand">
                <div class="brand-mark">DF</div>
                <div>
                    <h2>Dagooc Farm</h2>
                    <p>Owner & Staff Portal</p>
                </div>
            </div>

            <h1>Choose Your Role</h1>
            <p class="subtext">Sample internal system access for presentation purposes.</p>

            <form method="post">
                {% csrf_token %}
                <div class="role-grid">
                    <button type="submit" name="role" value="owner" class="role-btn owner">Randy Dagooc<br><small>Owner / CEO</small></button>
                    <button type="submit" name="role" value="finance" class="role-btn finance">Finance Staff</button>
                    <button type="submit" name="role" value="inventory" class="role-btn inventory">Lito Salazar<br><small>Inventory</small></button>
                    <button type="submit" name="role" value="sales" class="role-btn sales">Rica Jumao-as<br><small>Sales</small></button>
                    <button type="submit" name="role" value="hr" class="role-btn hr">Nico Reyes<br><small>HR</small></button>
                    <button type="submit" name="role" value="staff" class="role-btn staff">Regular Staff</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
