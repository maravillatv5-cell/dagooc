{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagooc Farm Login</title>
    <link rel="stylesheet" href="{% static 'farm_management/styles.css' %}">
    <script defer src="{% static 'farm_management/view-mode.js' %}"></script>
</head>
<body class="login-body">
    <div class="page-watermark" aria-hidden="true"></div>
    <div class="login-shell">
        <div class="login-panel">
            <div class="view-mode-switch" role="group" aria-label="Preview layout">
                <button type="button" data-view-mode-choice="desktop" aria-pressed="true">Desktop</button>
                <button type="button" data-view-mode-choice="mobile" aria-pressed="false">Mobile</button>
            </div>
            <div class="brand-box login-brand">
                <div class="brand-mark">DF</div>
                <div>
                    <h2>Dagooc Farm</h2>
                    <p>Owner & Staff Portal</p>
                </div>
            </div>

            <h1>Sign in</h1>
            <p class="subtext">Enter your account credentials to continue.</p>

            <form class="credential-form" method="post">
                {% csrf_token %}
                <div class="credential-field">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                </div>
                <div class="credential-field">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                </div>
                {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
                <button type="submit" class="primary-btn credential-submit">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
